name: Release

# Push a tag like v0.5.0 to publish a release. HACS offers the new version to everyone who installed
# the integration through it. Before tagging: bump "version" in custom_components/ring_keypad_gen1/manifest.json
# and fill in the matching "## [0.5.0]" section of CHANGELOG.md; this workflow refuses the tag otherwise.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the tag against the manifest and changelog
        run: python3 scripts/release_check.py "$GITHUB_REF_NAME" --notes release-notes.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Run the tests
        run: |
          uv venv
          uv pip install pytest pytest-homeassistant-custom-component
          .venv/bin/pytest -v

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md $flags
